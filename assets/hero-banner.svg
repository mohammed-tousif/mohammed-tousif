<rect y="198" width="11" height="22" fill="#00ff41"><animate attributeName="x" from="70" to="830" dur="3s" begin="0.6s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<text x="70" y="250" font-size="15" fill="#4a4a4a">$<tspan fill="#00ff41">_</tspan></text>
