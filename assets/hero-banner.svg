<text x="70" y="145" font-size="27" font-weight="bold" fill="#00ff41">&gt;&gt; Mohammed Tousif Malekopp</text>
<text x="70" y="180" font-size="16"><tspan fill="#00ff41">$</tspan><tspan fill="#c9d1d9"> cat role.txt</tspan></text>
