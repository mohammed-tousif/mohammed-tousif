<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#000000"/><stop offset="100%" stop-color="#001a08"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00ff41" stroke-width="0.3" opacity="0.15"/></pattern>
<linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00ff41" stop-opacity="0"/><stop offset="50%" stop-color="#00ff41" stop-opacity="0.15"/><stop offset="100%" stop-color="#00ff41" stop-opacity="0"/></linearGradient>
<clipPath id="typeClip"><rect x="70" y="195" width="0" height="35"><animate attributeName="width" from="0" to="760" dur="3s" begin="0.6s" fill="freeze"/></rect></clipPath>
</defs>
<rect width="1200" height="300" fill="url(#bgGrad)"/>
<rect width="1200" height="300" fill="url(#grid)"/>
<g font-family="monospace" font-size="14" fill="#00ff41" opacity="0.12">
<text x="16" y="0"><animate attributeName="y" from="-20" to="320" dur="7s" repeatCount="indefinite"/>01</text>
<text x="1170" y="-40"><animate attributeName="y" from="-40" to="320" dur="9s" begin="1s" repeatCount="indefinite"/>10</text>
<text x="1180" y="-10"><animate attributeName="y" from="-10" to="320" dur="6s" begin="2s" repeatCount="indefinite"/>01</text>
<text x="990" y="-30"><animate attributeName="y" from="-30" to="320" dur="8s" begin="0.5s" repeatCount="indefinite"/>11</text>
<text x="20" y="-60"><animate attributeName="y" from="-60" to="320" dur="10s" begin="3s" repeatCount="indefinite"/>00</text>
</g><rect x="40" y="30" width="1120" height="240" rx="12" ry="12" fill="#0d1117" stroke="#00ff41" stroke-width="1.5" opacity="0.95" filter="url(#glow)"/>
<path d="M 40 42 Q 40 30 52 30 L 1148 30 Q 1160 30 1160 42 L 1160 64 L 40 64 Z" fill="#161b22"/>
<circle cx="64" cy="47" r="6" fill="#ff5f56"/>
<circle cx="84" cy="47" r="6" fill="#ffbd2e"/>
<circle cx="104" cy="47" r="6" fill="#27c93f"/>
